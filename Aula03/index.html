<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Média do Aluno</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="mb-0">Cadastro do Aluno</h3>
                    </div>

                    <div class="card-body">

                        <form id="formAluno">

                            <!-- Nome -->
                            <div class="mb-3">

                                <label for="nome" class="form-label">
                                    Nome do aluno
                                </label>

                                <input
                                    type="text"
                                    id="nome"
                                    class="form-control"
                                    placeholder="Digite o nome do aluno">

                            </div>


                            <!-- Notas -->
                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label for="nota1" class="form-label">
                                        Nota 1
                                    </label>

                                    <input
                                        type="number"
                                        id="nota1"
                                        class="form-control"
                                        min="0"
                                        max="10"
                                        step="0.1">

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label for="nota2" class="form-label">
                                        Nota 2
                                    </label>

                                    <input
                                        type="number"
                                        id="nota2"
                                        class="form-control"
                                        min="0"
                                        max="10"
                                        step="0.1">

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label for="nota3" class="form-label">
                                        Nota 3
                                    </label>

                                    <input
                                        type="number"
                                        id="nota3"
                                        class="form-control"
                                        min="0"
                                        max="10"
                                        step="0.1">

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label for="nota4" class="form-label">
                                        Nota 4
                                    </label>

                                    <input
                                        type="number"
                                        id="nota4"
                                        class="form-control"
                                        min="0"
                                        max="10"
                                        step="0.1">

                                </div>

                            </div>


                            <!-- Média -->
                            <div class="alert alert-info text-center">

                                <h5>Média do aluno</h5>

                                <h2 id="media">-</h2>

                            </div>


                            <!-- Botão -->
                            <button
                                type="submit"
                                class="btn btn-primary w-100">

                                Registrar resultado

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
