<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resultado</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white text-center">

                        <h3 class="mb-0">
                            Resultado do Aluno
                        </h3>

                    </div>


                    <div class="card-body text-center">

                        <h4 id="nomeResultado" class="mb-4"></h4>


                        <p class="text-muted mb-1">
                            Média final
                        </p>

                        <h1 id="mediaResultado"></h1>


                        <div id="situacao" class="alert mt-4">
                        </div>


                        <a href="index.html"
                           class="btn btn-secondary w-100">

                            Voltar

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script>

        // Recupera os dados
        const nome = sessionStorage.getItem("nome");

        const media = Number(
            sessionStorage.getItem("media")
        );


        // Exibe o nome
        document.getElementById("nomeResultado")
            .textContent = nome;


        // Exibe a média
        document.getElementById("mediaResultado")
            .textContent = media.toFixed(2);


        // Elemento da situação
        const situacao =
            document.getElementById("situacao");


        // Verifica a situação do aluno
        if (media > 6) {

            situacao.textContent = "APROVADO";

            situacao.classList.add("alert-success");

        } else if (media >= 2) {

            situacao.textContent = "EXAME";

            situacao.classList.add("alert-warning");

        } else {

            situacao.textContent = "REPROVADO";

            situacao.classList.add("alert-danger");

        }

    </script>

</body>

</html>
