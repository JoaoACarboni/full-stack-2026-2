<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta de CEP</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 500px;">

    <h1 class="h4 text-success mb-3">Informe o CEP</h1>
    <p class="text-muted">
      Digite o CEP e ao sair o campo o endereço será completado.
      Pode utilizar a tecla TAB após digitar o CEP.
    </p>

    <form id="form-cep">

      <div class="mb-3 row">
        <label for="cep" class="col-sm-2 col-form-label">Cep:</label>
        <div class="col-sm-4">
          <input type="text" class="form-control" id="cep" maxlength="9" placeholder="00000-000" />
        </div>
      </div>

      <div class="mb-3 row">
        <label for="rua" class="col-sm-2 col-form-label">Rua:</label>
        <div class="col-sm-10">
          <input type="text" class="form-control" id="rua" readonly />
        </div>
      </div>

      <div class="mb-3 row">
        <label for="bairro" class="col-sm-2 col-form-label">Bairro:</label>
        <div class="col-sm-6">
          <input type="text" class="form-control" id="bairro" readonly />
        </div>
      </div>

      <div class="mb-3 row">
        <label for="cidade" class="col-sm-2 col-form-label">Cidade:</label>
        <div class="col-sm-6">
          <input type="text" class="form-control" id="cidade" readonly />
        </div>
      </div>

      <div class="mb-3 row">
        <label for="estado" class="col-sm-2 col-form-label">Estado:</label>
        <div class="col-sm-2">
          <input type="text" class="form-control" id="estado" readonly />
        </div>
      </div>

      <div class="mb-3 row">
        <label for="ibge" class="col-sm-2 col-form-label">IBGE:</label>
        <div class="col-sm-3">
          <input type="text" class="form-control" id="ibge" readonly />
        </div>
      </div>

    </form>

  </div>

  <script>

    const inputCep = document.querySelector("#cep");

    function limparCampos() {
      document.querySelector("#rua").value = "";
      document.querySelector("#bairro").value = "";
      document.querySelector("#cidade").value = "";
      document.querySelector("#estado").value = "";
      document.querySelector("#ibge").value = "";
    }

    inputCep.addEventListener("blur", function () {
      const cep = inputCep.value.replace(/\D/g, "");

     // Verifica tamanho do CEP (8 dígitos)
      if (cep.length !== 8) {
        return;
      }

      const url = `https://viacep.com.br/ws/${cep}/json/`;

      fetch(url)
        .then(function (resposta) {
          return resposta.json(); 
        })
        .then(function (dados) {
          // Trata se o CEP não existe
          if (dados.erro) {
            alert("CEP não encontrado. Verifique o número digitado.");
            limparCampos();
            return;
          }

          document.querySelector("#rua").value = dados.logradouro;
          document.querySelector("#bairro").value = dados.bairro;
          document.querySelector("#cidade").value = dados.localidade;
          document.querySelector("#estado").value = dados.uf;
          document.querySelector("#ibge").value = dados.ibge;
        })
        .catch(function (erro) {
          console.error("Erro ao buscar o CEP:", erro);
        });
    });
  </script>

</body>
</html>
